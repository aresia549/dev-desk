
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team sign in — Delivery Desk</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app-bg">

<nav class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">D</span>
    <span>delivery<span class="brand-light">desk</span></span>
  </a>
  <a class="text-link" href="index.html">← Home</a>
</nav>

<main class="login-wrap">
  <section class="login-card">
    <span class="eyebrow"><i></i> PRIVATE TEAM ACCESS</span>
    <h1>Welcome back.</h1>
    <p>Sign in to manage deliveries and team activity.</p>

    <form id="loginForm">
      <label>
        Email address
        <input type="email" id="loginEmail"
          required placeholder="name@company.com">
      </label>

      <label>
        Password
        <input type="password" id="loginPassword"
          required placeholder="Enter password">
      </label>

      <button class="btn btn-primary submit-btn" id="loginButton">
        Sign in <span>→</span>
      </button>
    </form>

    <p id="loginMessage" role="alert"
       style="margin-top:15px;color:#b42318"></p>

    <a class="text-link" href="index.html">Back to website</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>

<script>
(async function () {
  const config = window.DELIVERY_DESK_CONFIG;

  if (!config || !config.SUPABASE_URL ||
      !config.SUPABASE_ANON_KEY ||
      !window.supabase) {
    document.getElementById("loginMessage").textContent =
      "Supabase configuration is missing. Check assets/config.js.";
    return;
  }

  const db = window.supabase.createClient(
    config.SUPABASE_URL,
    config.SUPABASE_ANON_KEY
  );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("loginMessage");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Signing in...";

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      const { data: profile, error: profileError } = await db
        .from("user_profiles")
        .select("role, workspace_id, is_active")
        .eq("user_id", data.user.id)
        .single();

      if (profileError || !profile || !profile.is_active) {
        await db.auth.signOut();
        throw new Error("Your account has no active Delivery Desk team profile. Contact the owner.");
      }

      if (!["owner", "employee"].includes(profile.role)) {
        await db.auth.signOut();
        throw new Error("Your account does not have an authorised team role.");
      }

      window.location.href = "dashboard.html";

    } catch (error) {
      message.textContent = error.message || "Sign-in failed.";
      button.disabled = false;
      button.innerHTML = 'Sign in <span>→</span>';
    }
  });
})();
</script>

</body>
</html>
